name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # OPA and conftest versions/checksums are pinned in .github/actions/install-policy-tools.
  ACTIONLINT_VERSION: 1.7.7
  WASM_ENTRYPOINTS: dockerfile/multistage/deny

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        run: |
          bash <(curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "${ACTIONLINT_VERSION}"
          ./actionlint -color

  policy-bundle:
    name: Policy bundle (S1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Release packaging (S2) builds from the pinned policy source commit.
          fetch-depth: 0

      - uses: ./.github/actions/install-policy-tools

      - name: Rego format
        run: make fmt-check

      - name: Rego unit tests
        run: make test-rego

      - name: Conftest (Dockerfile.bad must be denied)
        run: make test-conftest-strict

      - name: Reproducible bundle, manifest order, byte-flip negative
        run: |
          read -ra eps <<< "${WASM_ENTRYPOINTS}"
          bash scripts/verify-bundle.sh "${eps[@]}"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: OPA wasm ABI / entrypoint smoke (NodeKit index 0)
        run: |
          read -ra eps <<< "${WASM_ENTRYPOINTS}"
          node scripts/wasm-abi-smoke.mjs build/dockguard.wasm "${eps[@]}"

      - name: Release package dry run (S2, pinned policy source)
        run: |
          bash scripts/package-release.sh v0.0.0 build/release
          cat build/release/release-provenance.json build/release/SHA256SUMS

      - name: Release package negatives (S2)
        run: bash scripts/test-release-negative.sh

      - name: Upload release dry-run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dockguard-release-dryrun-${{ github.sha }}
          path: build/release/
          if-no-files-found: warn

      - name: Upload bundle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dockguard-bundle-${{ github.sha }}
          path: |
            build/dockguard.wasm
            build/policies.json
            build/provenance.json
            build/SHA256SUMS
          if-no-files-found: warn
